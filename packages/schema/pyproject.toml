[project]
name = "footballfoundry-schema"
version = "0.1.0"
description = "Event and world data contract shared by the FootballFoundry generator, agents and Fabric tables"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/footballfoundry_schema"]
