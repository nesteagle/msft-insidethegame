[project]
name = "footballfoundry-agents"
version = "0.1.0"
description = "Live match-analyst service: Event Hubs consumer, trigger rules and a Microsoft Agent Framework multi-agent workflow"
requires-python = ">=3.11"
dependencies = [
    "footballfoundry-schema",
    # Tool result views shared with the MCP server.
    "footballfoundry-mcp",
    # The control room simulates and streams matches.
    "footballfoundry",
    "agent-framework-core>=1.19,<2",
    "agent-framework-foundry>=1.13,<2",
    # The chat endpoint speaks AG-UI to the web app.
    "agent-framework-ag-ui>=1.4,<2",
    # Agent Framework's MCP client; it requires the 1.x SDK.
    "mcp>=1.24,<2",
    "azure-identity>=1.15",
    "azure-eventhub>=5.11",
    "azure-eventhub-checkpointstoreblob-aio>=1.2",
    "azure-cosmos>=4.9",
    # Translates personalised insights (API 2026-06-06: NMT, or an LLM with tone control).
    "azure-ai-translation-text>=2.0",
    "starlette>=0.48",
    "uvicorn>=0.31",
]

[project.optional-dependencies]
monitor = ["azure-monitor-opentelemetry>=1.6"]

[project.scripts]
footballfoundry-agents = "footballfoundry_agents.cli:main"

[tool.uv.sources]
footballfoundry-schema = { workspace = true }
footballfoundry-mcp = { workspace = true }
footballfoundry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/footballfoundry_agents"]
